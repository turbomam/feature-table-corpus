name: verify corpus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Index invariants and vendored checksums
        run: uv run --with pyyaml python scripts/verify.py

      # A duplicate id once passed every check, because the only assertion
      # lived in an uncommitted script. Prove the check can fail before
      # trusting it to say the corpus is clean. Each injected defect below is
      # one the verifier claims to catch, so the claim is tested and not just
      # written down.
      - name: Prove the invariant check can fail
        run: |
          cp corpus.yaml /tmp/corpus.good.yaml
          restore() { cp /tmp/corpus.good.yaml corpus.yaml; }
          expect_reject() {
            if uv run --with pyyaml python scripts/verify.py > /tmp/out.txt 2>&1; then
              echo "FAIL: verifier accepted an index with $1"; cat /tmp/out.txt; restore; exit 1
            fi
            if ! grep -q "$2" /tmp/out.txt; then
              echo "FAIL: verifier rejected $1 but never printed $2"; cat /tmp/out.txt; restore; exit 1
            fi
            echo "ok: rejected $1 with $2"; restore
          }

          # Duplicate id AND duplicate path: copying an entry whole does both.
          uv run --with pyyaml python - <<'PY'
          import yaml, copy
          d = yaml.safe_load(open("corpus.yaml"))
          d["entries"].append(copy.deepcopy(d["entries"][0]))
          yaml.safe_dump(d, open("corpus.yaml", "w"), sort_keys=False)
          PY
          expect_reject "a duplicated entry" "DUPLICATE-ID"

          uv run --with pyyaml python - <<'PY'
          import yaml, copy
          d = yaml.safe_load(open("corpus.yaml"))
          d["entries"].append(copy.deepcopy(d["entries"][0]))
          yaml.safe_dump(d, open("corpus.yaml", "w"), sort_keys=False)
          PY
          expect_reject "a duplicated path" "DUPLICATE-PATH"

          # Missing required field.
          uv run --with pyyaml python - <<'PY'
          import yaml, copy
          d = yaml.safe_load(open("corpus.yaml"))
          e = copy.deepcopy(d["entries"][0]); e["id"] = "no-license"; e.pop("license", None)
          d["entries"].append(e)
          yaml.safe_dump(d, open("corpus.yaml", "w"), sort_keys=False)
          PY
          expect_reject "a missing license" "MISSING-FIELDS"

          # Two identities for one upstream artifact.
          uv run --with pyyaml python - <<'PY'
          import yaml, copy
          d = yaml.safe_load(open("corpus.yaml"))
          src = next(e for e in d["entries"] if e["tier"] == "linked")
          e = copy.deepcopy(src); e["id"] = src["id"] + "-again"
          d["entries"].append(e)
          yaml.safe_dump(d, open("corpus.yaml", "w"), sort_keys=False)
          PY
          expect_reject "a duplicated origin_url" "DUPLICATE-URL"

          # An entry the index rejects must not crash the file pass.
          uv run --with pyyaml python - <<'PY'
          import yaml
          d = yaml.safe_load(open("corpus.yaml"))
          d["entries"].append({"id": "no-tier-no-path", "label": "x", "source": "x",
                               "license": "x", "retrieved": "2026-01-01"})
          yaml.safe_dump(d, open("corpus.yaml", "w"), sort_keys=False)
          PY
          expect_reject "an entry with no tier" "UNKNOWN-TIER"

          # The corpus's central promise is that a file under a sourced
          # directory is byte-for-byte what its origin served. Prove the check
          # that guards it can fail, by writing into one and by stripping the
          # provenance from a derived one.
          restore_data() { git checkout -- data; }
          echo "# derived-from: injected" >> data/nmdc/nmdc_wfmgan-11-bvg4py20.1_crt.gff
          if uv run --with pyyaml python scripts/verify.py > /tmp/out.txt 2>&1; then
            echo "FAIL: verifier accepted a sourced file that had been written into"
            cat /tmp/out.txt; restore_data; exit 1
          fi
          grep -q "SOURCED-EDITED" /tmp/out.txt || {
            echo "FAIL: rejected it without naming SOURCED-EDITED"; cat /tmp/out.txt; restore_data; exit 1; }
          echo "ok: rejected a sourced file that had been written into"
          restore_data

          grep -v "^# single-change: " data/derived-malformed/dangling_parent.gff3 > /tmp/dp
          cp /tmp/dp data/derived-malformed/dangling_parent.gff3
          if uv run --with pyyaml python scripts/verify.py > /tmp/out.txt 2>&1; then
            echo "FAIL: verifier accepted a derived file with no provenance"
            cat /tmp/out.txt; restore_data; exit 1
          fi
          grep -q "NO-PROVENANCE" /tmp/out.txt || {
            echo "FAIL: rejected it without naming NO-PROVENANCE"; cat /tmp/out.txt; restore_data; exit 1; }
          echo "ok: rejected a derived file with no provenance"
          restore_data

          # Prose drifting from the index has been a review finding twice.
          # Change the NUMBER, not the tier word: the tier word is inside the
          # pattern the checker accepts, so changing it proves nothing. An
          # earlier version of this step made exactly that mistake and failed
          # the build while the checker was working correctly.
          cp README.md /tmp/README.good.md
          sed -i -E 's/^[0-9]+ entries in /999 entries in /' README.md
          if uv run --with pyyaml python scripts/verify.py > /tmp/out.txt 2>&1; then
            echo "FAIL: verifier accepted a README total that disagrees with the index"
            cat /tmp/out.txt; cp /tmp/README.good.md README.md; exit 1
          fi
          if ! grep -q "README-COUNT" /tmp/out.txt; then
            echo "FAIL: rejected the README but never printed README-COUNT"
            cat /tmp/out.txt; cp /tmp/README.good.md README.md; exit 1
          fi
          echo "ok: rejected a README total that no longer matches the index"
          cp /tmp/README.good.md README.md

      # git diff ignores untracked files, so a fixture deleted from the pull
      # request would be silently recreated and the step would pass. Staging
      # first makes additions, deletions and modifications all visible.
      - name: Derived fixtures reproduce exactly
        run: |
          python3 scripts/make_malformed.py
          git add -A -- data/derived-malformed data/derived-edge-cases
          git diff --cached --exit-code --stat -- data/derived-malformed data/derived-edge-cases
          test "$(ls data/derived-malformed | wc -l)" -eq 6
          test "$(ls data/derived-edge-cases | wc -l)" -eq 2

      - name: Origin URLs (reported, never fatal)
        continue-on-error: true
        run: uv run --with pyyaml python scripts/verify.py --links
