name: NMDC DataObject profile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # Installs the version in .python-version, which every uv run below uses.
      - name: Install Python from .python-version
        run: uv python install
      - name: Profile accounting and negative controls (offline)
        run: uv run --with linkml-runtime python -m unittest discover -s tests -p 'test_nmdc_profile.py' -v
