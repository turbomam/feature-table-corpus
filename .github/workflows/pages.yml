name: documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per branch outside PRs) at a time. On main, runs queue
# instead of cancelling. GitHub does not guarantee queue order, so main runs build
# main's head at the moment they start rather than the commit that triggered them.
# The last run to start begins after the last push, so it always publishes the latest main.
concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty means the triggering ref, which is what PR previews need.
          ref: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'main' || '' }}
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'
      - name: Build documentation and check internal links
        run: just docs-build
      - name: Retain PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: local/site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: local/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy successful main build
        id: deployment
        uses: actions/deploy-pages@v4
