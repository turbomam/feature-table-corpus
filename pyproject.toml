[project]
name = "ber-feature-model"
version = "0.1.0"
description = "Validate Datasets against the BER feature model; the LinkML schema is bundled"
readme = "docs/how-it-fits.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "linkml>=1.11.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/turbomam/feature-table-corpus"
Documentation = "https://turbomam.github.io/feature-table-corpus/"

[project.scripts]
ber-feature-validate = "ber_feature_model:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The package reuses the repository's files where they are, rather than moving them:
# scripts/ modules still import each other by name, and the justfile keeps working.
[tool.hatch.build.targets.wheel]
packages = ["src/ber_feature_model"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/validate_closed.py" = "ber_feature_model/validate_closed.py"
"scripts/feature_locations.py" = "ber_feature_model/feature_locations.py"
"model/schema/ber_feature_model.yaml" = "ber_feature_model/schema/ber_feature_model.yaml"
"model/schema/attributes.yaml" = "ber_feature_model/schema/attributes.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "src/ber_feature_model",
    "scripts/validate_closed.py",
    "scripts/feature_locations.py",
    "model/schema/ber_feature_model.yaml",
    "model/schema/attributes.yaml",
    "docs/how-it-fits.md",
    "LICENSE",
]

# The justfile runs tools with `uv run --with ...`; this file must not make uv sync a project
# environment for those commands.
[tool.uv]
managed = false
