# Validator expectations for the conversion contract model/profiles/gff3-contig.yaml.
# Kept out of the contract so its checksum in the conversion report stays stable.
profile: gff3-contig/1.0.0
# Independent validator observations; reproduce with just validity-check.
validation:
  scope: Exact rule sets for the listed retained corpus inputs, including negative controls. These are
    validator observations, not conversion-support claims.
  genometools:
    status: measured
    expected_failures:
      attribute-assignment: The deliberately unescaped semicolon leaves an attribute without an equals
        sign.
      illegal-phase: The deliberately malformed CDS fixture has phase 3.
      inconsistent-id-type: The deliberately duplicated ID joins rows of different feature types.
      missing-version: 'The required first-line ##gff-version directive is absent. GenomeTools stops here;
        later defects are not measured.'
      start-after-end: The deliberately malformed feature starts after its end.
      unresolved-parent: The deliberately malformed Parent value refers to an absent ID.
  gff3toolkit:
    status: measured
    expected_failures:
      Ema0003: The reversed-coordinate control is reported outside its parent boundaries.
      Ema0005: The RefSeq chromosome contains pseudogene children that this QC rule rejects.
      Emr0003: The duplicate-ID control is reported as a duplicate.
      Esf0003: QC reports strand . as missing, including the protein-relative Pfam hits and unstranded
        annotation families.
      Esf0014: 'The first line lacks ##gff-version. The source is preserved without adding it.'
      Esf0018: The reversed-coordinate control starts after its end.
      Esf0022: Some NMDC search files have an empty source column; QC requires a dot.
      Esf0026: The deliberately malformed CDS fixture has phase 3.
      Esf0029: The unescaped-semicolon control has a bare attribute rather than one equals sign.
      Esf0031: The unescaped-semicolon control also produces an empty attribute value.
      Esf0036: QC reports literal commas in attributes, including partial and product. This is recorded
        as a tool result, not a universal dialect prohibition.
  agat:
    status: blocked
    expected_failures: null
    reason: No measured rule list. See analyses/format-validation/agat-blocker.json for the 2026-09-25
      macOS arm64 dependency failure.
