rules:
  no_empty_title:
    level: error
  permissible_values_format:
    level: error
    format: snake
  tree_root_class:
    level: error
    root_class_name: Container
    validate_existing_class_name: false
  recommended:
    level: error
  no_xsd_int_type:
    level: error
  no_invalid_slot_usage:
    level: error
  no_undeclared_slots:
    level: error
  no_undeclared_ranges:
    level: error
  one_identifier_per_class:
    level: error
  one_key_per_class:
    level: error
  root_type_checks:
    level: error
  standard_naming:
    level: error
    permissible_values_upper_case: false
  canonical_prefixes:
    level: error
    prefixmaps_contexts:
      - merged
