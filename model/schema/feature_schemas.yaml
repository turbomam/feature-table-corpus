id: https://w3id.org/ber-data/feature-schemas
name: feature-schemas
title: BER feature schemas (two schemas, one documentation site)
description: >-
  Documentation entry point only. It imports two separate schemas, the BER feature model
  and the source-document schema, plus the attribute module both of them import, so this
  site can show every class once and every relationship between them. Each schema keeps
  its own file, identifier and prefix; validate data against ber_feature_model.yaml or
  source_document.yaml, never against this file.
license: CC BY 4.0
prefixes:
  linkml: https://w3id.org/linkml/
  bfs: https://w3id.org/ber-data/feature-schemas/
default_prefix: bfs
default_range: string
imports:
  - linkml:types
  - ber_feature_model
  - source_document
