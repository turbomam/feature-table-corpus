description: >-
  For each dialect under model/dialects/, one real input in the repository, whole or an excerpt of
  unchanged rows, that maps to the
  feature model and back with nothing skipped, refused or changed, byte for byte. Keeping the
  source's spelling of numbers alongside the model data counts as unchanged
  (https://github.com/turbomam/feature-table-corpus/issues/107). tests/test_clean_round_trips.py runs
  every `clean` entry and fails if a dialect has no entry. A `gap` entry names the issue that tracks
  it and has no input yet; when one is vendored, the entry becomes `clean`.
dialects:
  img-functional-gff:
    status: clean
    mapping: img_functional_map
    inputs:
    - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_functional_annotation.gff
  img-per-method-gff:
    status: clean
    mapping: img_per_method_map
    inputs:
    - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_functional_annotation.gff
    - - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_pfam.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_cog.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_ko_ec.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_tigrfam.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_smart.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_supfam.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_cath_funfam.gff
  img-tmhmm-signalp-gff:
    status: clean
    mapping: img_tmhmm_signalp_map
    inputs:
    - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_functional_annotation.gff
    - - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_tmh.gff
      - corpus/sources/jgi-img/IMG_AP-1268149/Ga0423362_cleavage_sites.gff
  img-taxon-bundle:
    status: clean
    mapping: img_taxon_bundle_map
    inputs:
    - corpus/sources/jgi-img/IMG_AP-1121004/2708743150.gff
  img-assembled-gff:
    status: clean
    mapping: img_assembled_gff_map
    inputs:
    - corpus/sources/jgi-img/IMG_AP-1121004/106476.assembled.gff
  phytozome-gene-exons-gff3:
    status: clean
    mapping: phytozome_gene_exons_map
    inputs:
    - corpus/derived-examples/populus-v4.1-chr01-200-genes.gene_exons.gff3
  phytozome-annotation-info:
    status: gap
    issue: https://github.com/turbomam/feature-table-corpus/issues/144
    note: >-
      The Populus v4.1 table differs from TAIR10's in layout and peptide names, so the dialect
      doesn't read it yet. TAIR10 round-trips byte for byte outside CI; TAIR restricts
      redistribution.
