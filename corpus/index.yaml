  notes: Not GFF, and a different field count from nmdc-ec/nmdc-ko (6 fields here, not 11). No header.
    Field 1 is a sequence id, field 2 is the constant value 1 across all three rows in this sample,
    field 3 increases per row (106, 154, 199, plausibly a position but unverified), field 4 is a
