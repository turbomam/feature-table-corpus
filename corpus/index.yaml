  license: CC BY 4.0
  notes: Not GFF. A tab-delimited, one-row-per-feature table with no header row, 11 fields, no
    column labels anywhere in the file. Field 1 is a feature id matching the GFF column-9 ID pattern
    from the same workflow run; field 3 is an EC CURIE; fields 4 and 9 are floats shaped like a percent
    (0-100) and a small exponential number respectively, consistent with a BLAST/HMMER-style hit
    record, but that is a shape observation, not a confirmed column meaning, since there is no header
    and no IMG/JGI pipeline documentation for this exact file has been checked yet. Column meanings are
    unverified
    and should not be asserted without reading the producing tool's own docs or source. This is one of
    the two largest tables in BERDL's nmdc.results namespace at production scale
    (annotation_enzyme_commission, 1.23 billion rows per project-nmdc-lakehouse-dump-and-reload), so
    its schema matters more than its 92-byte sample suggests.
