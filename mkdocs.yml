site_name: Feature table corpus
site_description: Real source evidence and a draft unified genomic feature model
site_url: https://turbomam.github.io/feature-table-corpus/
repo_url: https://github.com/turbomam/feature-table-corpus
edit_uri: blob/main/
docs_dir: local/site-src
site_dir: local/site
strict: true
theme:
  name: material
  custom_dir: site-overrides
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Schema: index.md
  - Source document schema: source-document/index.md
