tiers:
  vendored: the file is in this repository, with its origin URL and a checksum
  linked: the file is too large or not redistributable; a stable public URL is recorded instead
  restricted: the content sits behind a login; recorded for completeness and not fetchable here
  derived: built here from a vendored file by exactly one documented change; traceable, but NOT observed
    in the wild. See the validity field, which says whether the result is invalid GFF3 or valid and merely
    refused
  not located: known to exist, no public URL found; recorded so the gap stays visible
