# Harmonized instance data against schema/ber_feature_model.yaml, built 2026-09-18.
#
# Source: one full sequencing of one real biosample, data generation nmdc:omprc-11-2t8ft192
# ("Montane desert soil microbial communities from Mustang Region, Nepal - Schmidt56.soil.Nepal.3",
# PI Janet Jansson, GOLD Gp0452617, BioProject PRJEB42019). This spans seven real workflow
# executions (read QC, assembly, annotation x2 versions, read-based taxonomy, MAG binning x2
# versions); see notes.md for the full inventory and which of those seven actually produce
# feature-table content. This document harmonizes a representative slice, not all ~1,121 genes,
# from the assembly (nmdc:wfmgas-11-19jh9v28.1) and annotation (nmdc:wfmgan-11-5xxrm214.2) steps.
#
# Every source file this pulls from is cited per-feature below by its DataObject URL. The raw
# files themselves are not committed here (would be several MB across 76 files for one example);
# they're reproducible from the NMDC public API query in notes.md and sit in this worktree's
# gitignored local/ directory for verification.
#
# Non-duplication rules applied, same principle as the smaller example this replaces, extended
# with two new findings from this larger run:
# - Structural/Functional Annotation GFF roll-ups are still excluded in favor of the individual
#   gene-caller and per-database files.
# - NEW: Annotation Enzyme Commission (ec.tsv), Annotation KEGG Orthology (ko.tsv), and KO_EC
#   Annotation GFF are three views of the SAME underlying lastal hits, not independent evidence.
#   ko_ec.gff is the richest (full evidence plus both labels combined, e.g. "KO:K00059__EC:1.1.1.100")
#   and is used as the single source; ec.tsv and ko.tsv are not separately represented.
# - NEW: is_selected is not simply "the only caller wins." nmdc:wfmgas-11-19jh9v28.1_scf_1_c1_3_65
#   is a real Prodigal call with no competing GeneMark call at all, and it STILL does not appear in
#   Structural Annotation GFF, presumably filtered for length/confidence. So is_selected=false can
#   mean "lost to a competing caller" or "filtered out despite no competitor"; this schema does not
#   yet distinguish the two, which is worth raising as an open question.

contigs:
  - contig_id: nmdc:wfmgas-11-19jh9v28.1_scf_1_c1
    length_bp: 1754 # computed from nmdc_wfmgas-11-19jh9v28.1_contigs.fna
    taxonomic_lineage: [Bacteria, Pseudomonadota]
    lineage_confidence: 0.667 # from Scaffold Lineage tsv; shallower call than the per-gene phylogeny below

  - contig_id: nmdc:wfmgas-11-19jh9v28.1_scf_2_c1
    length_bp: 1624
    taxonomic_lineage: [Bacteria, Acidobacteriota, Terriglobia, Terriglobales, Acidobacteriaceae]
    lineage_confidence: 1.0

  - contig_id: nmdc:wfmgas-11-19jh9v28.1_scf_344_c1
    length_bp: 369
    # No taxonomic_lineage: this contig is genuinely absent from Scaffold Lineage tsv, not
    # unclassified by omission here. A 369bp contig carrying mostly a CRISPR array may simply be
    # too short or too repetitive to classify; not investigated further.

