# Harmonized instance data for one real, complete NMDC workflow execution,
# nmdc:wfmgan-11-ghk5e506.1 (data generation nmdc:omprc-11-4e682h13), against
# schema/ber_feature_model.yaml. Built 2026-09-18.
#
# Every one of the 25 DataObjects this run produced was fetched and read (listed at the
# bottom of this file). This document represents each real finding exactly once. See
# notes.md in this directory for the full reasoning; short version:
#
# - Structural Annotation GFF (the roll-up) contains only the Prodigal calls for both loci,
#   not GeneMark's competing calls for the same loci, even though GeneMark also ran. So
#   Prodigal's rows here are NOT duplicated from Prodigal Annotation GFF; is_selected marks
#   which caller's row is canonical.
# - Functional Annotation GFF's pfam=/cog=/cath_funfam=/superfamily= tags are dropped here.
#   They are bare accessions with none of the evidence (e-value, bitscore, alignment
#   coordinates) that the per-database GFFs (Pfam Annotation GFF, COG Annotation GFF, and
#   so on) carry for the identical hit. The per-database evidence rows are kept instead, and
#   linked to their gene via `parent`, so the same fact is not recorded twice at two
#   different levels of detail.
# - product/product_source come from Functional Annotation GFF's own attributes. Product
#   Names (product_names.tsv) is a byte-for-byte duplicate of the same two values and is
#   deliberately not used as a second source.
# - EC, KO, CRISPR Terms, RFAM, SMART, TIGRFAM, and TRNA are all real, empty (0-byte)
#   DataObjects for this particular run; no hits, so no rows. Confirmed by fetching every
#   one of them, not inferred from their absence.

